<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PageForge — Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:#eef2ff;
}

header{
  padding:20px 7%;
  border-bottom:1px solid #202a45;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#6d7cff;
}

main{
  max-width:900px;
  margin:35px auto;
  padding:0 20px;
}

.card{
  background:#11182b;
  border:1px solid #263352;
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
}

h1{
  margin-top:0;
}

h2{
  margin-top:0;
}

label{
  display:block;
  color:#aab6d4;
  font-size:13px;
  margin:15px 0 7px;
}

input,
textarea,
select{
  width:100%;
  background:#0b1120;
  border:1px solid #33405f;
  color:white;
  border-radius:10px;
  padding:12px;
  font-size:14px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#6d7cff;
  color:white;
  width:100%;
  margin-top:18px;
}

.danger{
  background:#dc2626;
  color:white;
}

.secondary{
  background:#202b49;
  color:#dce3ff;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.product{
  background:#0b1120;
  border:1px solid #263352;
  border-radius:14px;
  overflow:hidden;
}

.product img{
  width:100%;
  height:170px;
  object-fit:contain;
  background:white;
}

.info{
  padding:15px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin:10px 0;
}

  gap:8
