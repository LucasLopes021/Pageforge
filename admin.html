<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PageForge — Painel Administrativo</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(124,58,237,.22),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 0%,
            rgba(37,99,235,.20),
            transparent 35%
        ),
        #050509;
    color:#fff;
}

/* =========================
   GERAL
========================= */

button{
    border:0;
    cursor:pointer;
    font-family:inherit;
}

input,
textarea,
select{
    width:100%;
    padding:13px 14px;
    border-radius:10px;
    border:1px solid #29293d;
    background:#090911;
    color:#fff;
    outline:none;
    font-size:14px;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#7c3aed;
    box-shadow:0 0 0 3px rgba(124,58,237,.12);
}

textarea{
    min-height:110px;
    resize:vertical;
}

label{
    display:block;
    margin:15px 0 7px;
    color:#a9a9bd;
    font-size:13px;
    font-weight:bold;
}

/* =========================
   HEADER
========================= */

header{
    height:65px;
    padding:0 6%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(5,5,9,.90);
    border-bottom:1px solid #191923;

    position:sticky;
    top:0;
    z-index:10;

    backdrop-filter:blur(15px);
}

.logo{
    font-size:22px;
    font-weight:900;
}

.logo span{
    color:#8b5cf6;
}

/* =========================
   BOTÕES
========================= */

.btn{
    padding:12px 17px;
    border-radius:10px;
    font-weight:bold;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
    filter:brightness(1.08);
}

.btn-primary{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #2563eb
        );
}

.btn-secondary{
    color:#ddd;

    background:#151521;

    border:1px solid #29293d;
}

.btn-danger{
    color:#ffb8b8;

    background:#35151b;

    border:1px solid #5d202b;
}

/* =========================
   PAINEL
========================= */

#adminPanel{
    max-width:1150px;
    margin:0 auto;
    padding:35px 20px 60px;
}

.page-title{
    margin-bottom:25px;
}

.page-title h1{
    margin:0 0 7px;
    font-size:30px;
}

.page-title p{
    margin:0;
    color:#8f8fa3;
}

/* =========================
   CARDS
========================= */

.card{
    padding:22px;
    margin-bottom:20px;

    background:
        linear-gradient(
            145deg,
            #11111d,
            #090910
        );

    border:1px solid #222235;
    border-radius:17px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.20);
}

.card h2{
    margin:0 0 7px;
}

.description{
    margin:0 0 20px;
    color:#8d8da1;
    font-size:14px;
}

/* =========================
   ESTATÍSTICAS
========================= */

.stats{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);

    gap:15px;
    margin-bottom:20px;
}

.stat{
    padding:20px;

    background:
        linear-gradient(
            145deg,
            #11111d,
            #090910
        );

    border:1px solid #222235;
    border-radius:17px;
}

.stat-label{
    color:#8f8fa3;
    font-size:13px;
}

.stat-number{
    margin-top:8px;
    font-size:30px;
    font-weight:900;
}

/* =========================
   FORMULÁRIO
========================= */

.form-row{
    display:grid;
    grid-template-columns:
        1fr 1fr;

    gap:15px;
}

.form-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.form-actions .btn{
    flex:1;
}

.message{
    min-height:20px;
    margin-top:12px;
    font-size:13px;
}

.success{
    color:#4ade80;
}

.error{
    color:#ff6868;
}

/* =========================
   PRODUTOS
========================= */

.products{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(250px,1fr)
        );

    gap:16px;
}

.product{
    overflow:hidden;

    background:#08080f;

    border:1px solid #222235;
    border-radius:15px;
}

.product-image{
    width:100%;
    height:190px;

    display:block;

    object-fit:contain;

    background:#fff;
}

.product-content{
    padding:16px;
}

.product-platform{
    color:#8b5cf6;
    font-size:11px;
    font-weight:bold;
    text-transform:uppercase;
}

.product-name{
    margin:8px 0;
    font-size:17px;
    font-weight:bold;
}

.product-category{
    display:inline-block;

    padding:5px 9px;

    border-radius:20px;

    background:#1a1a2b;
    color:#aaaac0;

    font-size:11px;
}

.product-price{
    margin:12px 0 5px;
    font-size:20px;
    font-weight:bold;
}

.product-sales{
    color:#4ade80;
    font-size:12px;
    font-weight:bold;
}

.product-buttons{
    display:flex;
    gap:8px;
    margin-top:14px;
}

.product-buttons button{
    flex:1;
}

/* =========================
   VAZIO
========================= */

.empty{
    padding:35px 20px;

    text-align:center;

    color:#77778b;

    border:1px dashed #303047;

    border-radius:12px;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:700px){

    header{
        padding:0 20px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .form-row{
        grid-template-columns:1fr;
    }

    .form-actions{
        flex-direction:column;
    }

    .page-title h1{
        font-size:25px;
    }

}

</style>
</head>


<body>


<!-- =========================
     CABEÇALHO
========================= -->

<header>

    <div class="logo">
        Page<span>Forge</span>
    </div>

</header>


<!-- =========================
     PAINEL DIRETO
========================= -->

<section id="adminPanel">

    <div class="page-title">

        <h1>
            Painel administrativo
        </h1>

        <p>
            Gerencie seus produtos e ofertas do PageForge.
        </p>

    </div>


    <!-- =========================
         ESTATÍSTICAS
    ========================= -->

    <div class="stats">

        <div class="stat">

            <div class="stat-label">
                Produtos cadastrados
            </div>

            <div
                id="totalProducts"
                class="stat-number"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Vendas registradas
            </div>

            <div
                id="totalSales"
                class="stat-number"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Categorias
            </div>

            <div
                id="totalCategories"
                class="stat-number"
            >
                0
            </div>

        </div>

    </div>


    <!-- =========================
         CADASTRAR PRODUTO
    ========================= -->

    <div class="card">

        <h2 id="formTitle">
            Cadastrar produto
        </h2>

        <p class="description">
            Adicione um produto para aparecer no painel.
        </p>


        <div class="form-row">

            <div>

                <label for="platform">
                    Loja
                </label>

                <select id="platform">

                    <option value="Mercado Livre">
                        Mercado Livre
                    </option>

                    <option value="Shopee">
                        Shopee
                    </option>

                    <option value="Amazon">
                        Amazon
                    </option>

                    <option value="SHEIN">
                        SHEIN
                    </option>

                    <option value="Outra">
                        Outra
                    </option>

                </select>

            </div>


            <div>

                <label for="category">
                    Categoria
                </label>

                <input
                    id="category"
                    type="text"
                    placeholder="Ex.: Celular, Casa, Beleza"
                >

            </div>

        </div>


        <label for="name">
            Nome do produto
        </label>

        <input
            id="name"
            type="text"
            placeholder="Nome do produto"
        >


        <label for="image">
            Imagem do produto
        </label>

        <input
            id="image"
            type="url"
            placeholder="Cole o link da imagem"
        >


        <div class="form-row">

            <div>

                <label for="price">
                    Preço
                </label>

                <input
                    id="price"
                    type="text"
                    placeholder="Ex.: R$ 49,90"
                >

            </div>


            <div>

                <label for="sales">
                    Vendas registradas
                </label>

                <input
                    id="sales"
                    type="number"
                    min="0"
                    value="0"
                >

            </div>

        </div>


        <label for="description">
            Descrição
        </label>

        <textarea
            id="description"
            placeholder="Descrição do produto"
        ></textarea>


        <label for="link">
            Link do produto / afiliado
        </label>

        <input
            id="link"
            type="url"
            placeholder="Cole seu link de afiliado"
        >


        <div class="form-actions">

            <button
                id="saveButton"
                type="button"
                class="btn btn-primary"
                onclick="saveProduct()"
            >
                Adicionar produto
            </button>


            <button
                id="cancelButton"
                type="button"
                class="btn btn-secondary"
                onclick="cancelEdit()"
                style="display:none;"
            >
                Cancelar edição
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>

    </div>


    <!-- =========================
         PRODUTOS
    ========================= -->

    <div class="card">

        <h2>
            Produtos cadastrados
        </h2>

        <p class="description">
            Todos os produtos adicionados ao PageForge.
        </p>

        <div
            id="products"
            class="products"
        ></div>

    </div>

</section>


<script>

/* ==================================================
   CONFIGURAÇÃO
================================================== */

const PRODUCTS_KEY =
    "pageforge_products";

let editingId = null;


/* ==================================================
   ELEMENTOS
================================================== */

const productsArea =
    document.getElementById(
        "products"
    );

const totalProducts =
    document.getElementById(
        "totalProducts"
    );

const totalSales =
    document.getElementById(
        "totalSales"
    );

const totalCategories =
    document.getElementById(
        "totalCategories"
    );

const formTitle =
    document.getElementById(
        "formTitle"
    );

const saveButton =
    document.getElementById(
        "saveButton"
    );

const cancelButton =
    document.getElementById(
        "cancelButton"
    );

const message =
    document.getElementById(
        "message"
    );


/* ==================================================
   PEGAR PRODUTOS
================================================== */

function getProducts(){

    try{

        const data =
            localStorage.getItem(
                PRODUCTS_KEY
            );

        if(!data){
            return [];
        }

        const products =
            JSON.parse(data);

        if(!Array.isArray(products)){
            return [];
        }

        return products;

    }catch(error){

        console.error(
            "Erro ao carregar produtos:",
            error
        );

        return [];
    }
}


/* ==================================================
   SALVAR PRODUTOS
================================================== */

function saveProducts(
    products
){

    try{

        localStorage.setItem(
            PRODUCTS_KEY,
            JSON.stringify(products)
        );

        return true;

    }catch(error){

        console.error(
            "Erro ao salvar:",
            error
        );

        showMessage(
            "Não foi possível salvar o produto.",
            false
        );

        return false;
    }
}


/* ==================================================
   ADICIONAR / EDITAR
================================================== */

function saveProduct(){

    const platform =
        document.getElementById(
            "platform"
        ).value;

    const category =
        document.getElementById(
            "category"
        ).value.trim();

    const name =
        document.getElementById(
            "name"
        ).value.trim();

    const image =
        document.getElementById(
            "image"
        ).value.trim();

    const price =
        document.getElementById(
            "price"
        ).value.trim();

    const description =
        document.getElementById(
            "description"
        ).value.trim();

    const link =
        document.getElementById(
            "link"
        ).value.trim();

    const sales =
        Number(
            document.getElementById(
                "sales"
            ).value
        ) || 0;


    if(
        !name ||
        !image ||
        !price ||
        !link
    ){

        showMessage(
            "Preencha nome, imagem, preço e link.",
            false
        );

        return;
    }


    const products =
        getProducts();


    /* =========================
       EDITAR
    ========================= */

    if(editingId !== null){

        const index =
            products.findIndex(
                function(product){

                    return product.id === editingId;

                }
            );


        if(index === -1){

            showMessage(
                "Produto não encontrado.",
                false
            );

            return;
        }


        products[index] = {

            id:editingId,

            platform:platform,

            category:category,

            name:name,

            image:image,

            price:price,

            description:description,

            link:link,

            sales:sales

        };


        if(
            !saveProducts(
                products
            )
        ){

            return;
        }


        editingId = null;

        resetForm();

        renderProducts();

        showMessage(
            "Produto atualizado com sucesso!",
            true
        );

        return;
    }


    /* =========================
       NOVO PRODUTO
    ========================= */

    const product = {

        id:Date.now(),

        platform:platform,

        category:category,

        name:name,

        image:image,

        price:price,

        description:description,

        link:link,

        sales:sales

    };


    products.push(
        product
    );


    if(
        !saveProducts(
            products
        )
    ){

        return;
    }


    resetForm();

    renderProducts();

    showMessage(
        "Produto adicionado com sucesso!",
        true
    );
}


/* ==================================================
   EDITAR PRODUTO
================================================== */

function editProduct(
    id
){

    const products =
        getProducts();


    const product =
        products.find(
            function(item){

                return item.id === id;

            }
        );


    if(!product){
        return;
    }


    document.getElementById(
        "platform"
    ).value =
        product.platform ||
        "Mercado Livre";


    document.getElementById(
        "category"
    ).value =
        product.category || "";


    document.getElementById(
        "name"
    ).value =
        product.name || "";


    document.getElementById(
        "image"
    ).value =
        product.image || "";


    document.getElementById(
        "price"
    ).value =
        product.price || "";


    document.getElementById(
        "description"
    ).value =
        product.description || "";


    document.getElementById(
        "link"
    ).value =
        product.link || "";


    document.getElementById(
        "sales"
    ).value =
        product.sales || 0;


    editingId =
        id;


    formTitle.textContent =
        "Editar produto";


    saveButton.textContent =
        "Salvar alterações";


    cancelButton.style.display =
        "block";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });
}


/* ==================================================
   CANCELAR EDIÇÃO
================================================== */

function cancelEdit(){

    editingId =
        null;


    resetForm();


    formTitle.textContent =
        "Cadastrar produto";


    saveButton.textContent =
        "Adicionar produto";


    cancelButton.style.display =
        "none";
}


/* ==================================================
   EXCLUIR
================================================== */

function deleteProduct(
    id
){

    const confirmed =
        confirm(
            "Tem certeza que deseja excluir este produto?"
        );


    if(!confirmed){
        return;
    }


    const products =
        getProducts().filter(
            function(product){

                return product.id !== id;

            }
        );


    if(
        !saveProducts(
            products
        )
    ){

        return;
    }


    renderProducts();


    showMessage(
        "Produto excluído.",
        true
    );
}


/* ==================================================
   RENDERIZAR
================================================== */

function renderProducts(){

    const products =
        getProducts();


    productsArea.innerHTML =
        "";


    /* ESTATÍSTICAS */

    totalProducts.textContent =
        products.length;


    const sales =
        products.reduce(
            function(total,product){

                return total +
                    (
                        Number(
                            product.sales
                        ) || 0
                    );

            },
            0
        );


    totalSales.textContent =
        sales;


    const categories =
        new Set(
            products
                .map(
                    function(product){

                        return product.category;

                    }
                )
                .filter(Boolean)
        );


    totalCategories.textContent =
        categories.size;


    /* VAZIO */

    if(
        products.length === 0
    ){

        productsArea.innerHTML = `

            <div class="empty">

                Nenhum produto cadastrado ainda.

            </div>

        `;

        return;
    }


    /* PRODUTOS */

    products.forEach(
        function(product){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "product";


            const image =
                escapeHTML(
                    product.image
                );
