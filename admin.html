<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PageForge — Painel Administrativo</title>

<style>

/* =========================================================
   CONFIGURAÇÕES
========================================================= */

:root{

    --bg:#050509;

    --panel:#0d0d16;

    --panel2:#11111d;

    --border:#24243a;

    --text:#f5f5ff;

    --muted:#85859b;

    --purple:#8b5cf6;

    --blue:#2563eb;

    --green:#22c55e;

    --red:#ef4444;

}


*{

    box-sizing:border-box;

}


html{

    scroll-behavior:smooth;

}


body{

    margin:0;

    min-height:100vh;

    background:

        radial-gradient(
            circle at 10% 0%,
            rgba(139,92,246,.20),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 0%,
            rgba(37,99,235,.18),
            transparent 30%
        ),

        var(--bg);

    color:var(--text);

    font-family:

        Arial,
        Helvetica,
        sans-serif;

}


button,
input,
textarea,
select{

    font-family:inherit;

}


button{

    cursor:pointer;

}


.hidden{

    display:none !important;

}


/* =========================================================
   HEADER
========================================================= */

header{

    height:70px;

    padding:
        0 5%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    position:sticky;

    top:0;

    z-index:100;

    background:
        rgba(5,5,9,.90);

    backdrop-filter:
        blur(15px);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

}


.logo{

    font-size:23px;

    font-weight:900;

}


.logo span{

    color:var(--purple);

}


.header-actions{

    display:flex;

    gap:8px;

}


.button{

    padding:
        10px 14px;

    border-radius:10px;

    border:
        1px solid
        var(--border);

    background:
        var(--panel2);

    color:white;

    font-weight:700;

}


.button:hover{

    filter:brightness(1.15);

}


.button-primary{

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--blue)
        );

    border:none;

}


.button-danger{

    color:#ff8b8b;

    background:
        rgba(239,68,68,.10);

    border-color:
        rgba(239,68,68,.30);

}


/* =========================================================
   LOGIN
========================================================= */

.login-screen{

    min-height:
        calc(100vh - 70px);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}


.login-card{

    width:
        min(430px,100%);

    background:
        linear-gradient(
            145deg,
            #11111d,
            #09090f
        );

    border:
        1px solid
        var(--border);

    border-radius:22px;

    padding:30px;

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.45);

}


.login-icon{

    width:58px;

    height:58px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--blue)
        );

    font-size:28px;

    margin-bottom:20px;

}


.login-card h1{

    margin:
        0 0 8px;

    font-size:27px;

}


.login-card p{

    margin:
        0 0 24px;

    color:var(--muted);

    line-height:1.5;

}


/* =========================================================
   INPUTS
========================================================= */

label{

    display:block;

    margin-bottom:7px;

    color:#aaaabd;

    font-size:12px;

    font-weight:700;

}


input,
textarea,
select{

    width:100%;

    padding:13px;

    background:#08080e;

    color:white;

    border:
        1px solid
        #292940;

    border-radius:11px;

    outline:none;

}


input:focus,
textarea:focus,
select:focus{

    border-color:
        var(--purple);

    box-shadow:
        0 0 0 3px
        rgba(139,92,246,.12);

}


textarea{

    min-height:110px;

    resize:vertical;

}


.field{

    margin-top:15px;

}


/* =========================================================
   LOGIN BUTTON
========================================================= */

#loginButton{

    width:100%;

    padding:14px;

    margin-top:18px;

    border:0;

    border-radius:11px;

    color:white;

    font-weight:800;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--blue)
        );

}


#loginButton:active{

    transform:scale(.99);

}


.login-error{

    color:#ff7070;

    font-size:13px;

    margin-top:10px;

}


/* =========================================================
   DASHBOARD
========================================================= */

.container{

    width:
        min(1200px,calc(100% - 40px));

    margin:auto;

    padding:
        35px 0 70px;

}


.dashboard-title{

    margin-bottom:24px;

}


.dashboard-title h1{

    margin:
        0 0 7px;

    font-size:32px;

}


.dashboard-title p{

    margin:0;

    color:var(--muted);

}


/* =========================================================
   STATS
========================================================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:14px;

    margin-bottom:20px;

}


.stat{

    padding:20px;

    border:
        1px solid
        var(--border);

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            #11111d,
            #09090f
        );

}


.stat-label{

    color:var(--muted);

    font-size:12px;

    font-weight:700;

}


.stat-value{

    margin-top:8px;

    font-size:28px;

    font-weight:900;

}


/* =========================================================
   MAIN
========================================================= */

.main-grid{

    display:grid;

    grid-template-columns:
        380px 1fr;

    gap:18px;

}


.card{

    padding:22px;

    border:
        1px solid
        var(--border);

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #11111d,
            #09090f
        );

}


.card h2{

    margin:
        0 0 5px;

}


.card-description{

    color:var(--muted);

    font-size:13px;

    margin:
        0 0 18px;

}


/* =========================================================
   FORM BUTTONS
========================================================= */

#saveButton{

    width:100%;

    padding:14px;

    margin-top:18px;

    border:0;

    border-radius:11px;

    color:white;

    font-weight:800;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--blue)
        );

}


#cancelButton{

    width:100%;

    padding:12px;

    margin-top:9px;

    border-radius:11px;

    background:var(--panel2);

    color:white;

    border:
        1px solid
        var(--border);

}


.message{

    margin-top:12px;

    font-size:13px;

    font-weight:700;

}


.message-success{

    color:var(--green);

}


.message-error{

    color:#ff7070;

}


/* =========================================================
   PRODUCTS
========================================================= */

.products{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(230px,1fr)
        );

    gap:14px;

    margin-top:18px;

}


.product{

    overflow:hidden;

    border:
        1px solid
        var(--border);

    border-radius:15px;

    background:#08080e;

}


.product-image{

    width:100%;

    height:175px;

    object-fit:contain;

    background:white;

    display:block;

}


.product-info{

    padding:15px;

}


.platform{

    color:#9999ae;

    font-size:10px;

    font-weight:800;

    text-transform:uppercase;

}


.product-name{

    margin:
        7px 0;

    font-size:16px;

    font-weight:700;

}


.category{

    display:inline-block;

    padding:
        5px 8px;

    border-radius:20px;

    background:
        rgba(139,92,246,.12);

    color:#b99cff;

    font-size:10px;

}


.price{

    margin:
        10px 0 5px;

    font-size:20px;

    font-weight:900;

}


.sales{

    color:#6ee7a0;

    font-size:12px;

}


.product-actions{

    display:flex;

    gap:7px;

    margin-top:14px;

}


.product-actions button{

    flex:1;

    padding:9px;

    border-radius:9px;

    font-size:12px;

}


.empty{

    grid-column:
        1 / -1;

    text-align:center;

    padding:45px 20px;

    border:
        1px dashed
        #34344b;

    border-radius:14px;

    color:var(--muted);

}


/* =========================================================
   RESPONSIVO
========================================================= */

@media(max-width:950px){

    .main-grid{

        grid-template-columns:1fr;

    }


    .stats{

        grid-template-columns:
            repeat(2,1fr);

    }

}


@media(max-width:600px){

    header{

        padding:
            0 18px;

    }


    .container{

        width:
            calc(100% - 24px);

        padding-top:25px;

    }


    .stats{

        grid-template-columns:1fr;

    }


    .dashboard-title h1{

        font-size:26px;

    }

}

</style>

</head>


<body>


<!-- ======================================================
     HEADER
======================================================= -->

<header>

    <div class="logo">

        Page<span>Forge</span>

    </div>


    <div
        id="headerActions"
        class="header-actions hidden"
    >

        <button
            id="siteButton"
            class="button"
        >
            Ver site
        </button>


        <button
            id="logoutButton"
            class="button button-danger"
        >
            Sair
        </button>

    </div>

</header>



<!-- ======================================================
     LOGIN
======================================================= -->

<section
    id="loginScreen"
    class="login-screen"
>

    <div class="login-card">

        <div class="login-icon">
            ⚡
        </div>


        <h1>
            Painel administrativo
        </h1>


        <p>
            Acesse o painel do PageForge
            para administrar seus produtos
            e ofertas.
        </p>


        <div class="field">

            <label for="password">
                SENHA
            </label>

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Digite sua senha"
            >

        </div>


        <button
            id="loginButton"
            type="button"
        >
            Entrar no painel
        </button>


        <div
            id="loginError"
            class="login-error"
        ></div>

    </div>

</section>



<!-- ======================================================
     DASHBOARD
======================================================= -->

<main
    id="dashboard"
    class="container hidden"
>


    <div class="dashboard-title">

        <h1>
            Dashboard
        </h1>

        <p>
            Gerencie os produtos do PageForge.
        </p>

    </div>



    <!-- ==================================================
         ESTATÍSTICAS
    =================================================== -->

    <div class="stats">


        <div class="stat">

            <div class="stat-label">
                PRODUTOS
            </div>

            <div
                id="totalProducts"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                VENDAS
            </div>

            <div
                id="totalSales"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                CATEGORIAS
            </div>

            <div
                id="totalCategories"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                PREÇO MÉDIO
            </div>

            <div
                id="averagePrice"
                class="stat-value"
            >
                R$ 0,00
            </div>

        </div>


    </div>



    <!-- ==================================================
         CONTEÚDO
    =================================================== -->

    <div class="main-grid">


        <!-- ==================================================
             FORMULÁRIO
        =================================================== -->

        <div class="card">

            <h2 id="formTitle">
                Novo produto
            </h2>


            <p class="card-description">
                Cadastre uma nova oferta.
            </p>



            <div class="field">

                <label>
                    PLATAFORMA
                </label>

                <select id="platform">

                    <option>
                        Mercado Livre
                    </option>

                    <option>
                        Shopee
                    </option>

                    <option>
                        Amazon
                    </option>

                    <option>
                        SHEIN
                    </option>

                    <option>
                        Outra
                    </option>

                </select>

            </div>



            <div class="field">

                <label>
                    CATEGORIA
                </label>

                <input
                    id="category"
                    placeholder="Ex.: Beleza"
                >

            </div>



            <div class="field">

                <label>
                    NOME DO PRODUTO
                </label>

                <input
                    id="name"
                    placeholder="Nome do produto"
                >

            </div>



            <div class="field">

                <label>
                    URL DA IMAGEM
                </label>

                <input
                    id="image"
                    placeholder="https://..."
                >

            </div>



            <div class="field">

                <label>
                    PREÇO
                </label>

                <input
                    id="price"
                    placeholder="R$ 49,90"
                >

            </div>



            <div class="field">

                <label>
                    DESCRIÇÃO
                </label>

                <textarea
                    id="description"
                    placeholder="Descrição do produto..."
                ></textarea>

            </div>



            <div class="field">

                <label>
                    LINK DE AFILIADO
                </label>

                <input
                    id="link"
                    placeholder="https://..."
                >

            </div>



            <div class="field">

                <label>
                    VENDAS REGISTRADAS
                </label>

                <input
                    id="sales"
                    type="number"
                    min="0"
                    value="0"
                >

            </div>



            <button
                id="saveButton"
                type="button"
            >
                Adicionar produto
            </button>


            <button
                id="cancelButton"
                type="button"
                class="hidden"
            >
                Cancelar edição
            </button>


            <div
                id="message"
                class="message"
            ></div>

        </div>



        <!-- ==================================================
             PRODUTOS
        =================================================== -->

        <div class="card">

            <h2>
                Produtos cadastrados
            </h2>


            <p class="card-description">
                Gerencie suas ofertas.
            </p>


            <div
                id="products"
                class="products"
            ></div>

        </div>


    </div>

</main>

    }

/* =========================================================

        login();

    }

/* =========================================================
   LOGOUT
========================================================= */

    "click",
    function(){

        sessionStorage.removeItem(
            SESSION_KEY
        );

        location.reload();

    }
);
