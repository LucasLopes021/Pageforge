<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PageForge — Ofertas</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#0b1020;
  color:#eef2ff;
}

header{
  padding:22px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #202a45;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#6d7cff;
}

.badge{
  font-size:12px;
  padding:7px 11px;
  border:1px solid #33405f;
  border-radius:99px;
  color:#aab6d4;
}

main{
  max-width:1250px;
  margin:35px auto;
  padding:0 20px;
}

.hero{
  text-align:center;
  margin-bottom:35px;
}

.hero h1{
  font-size:42px;
  margin:0 0 10px;
}

.hero p{
  color:#9eabc8;
  margin:0;
}

.section-title{
  margin:30px 0 18px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.product-card{
  background:#11182b;
  border:1px solid #263352;
  border-radius:18px;
  overflow:hidden;
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-4px);
  border-color:#6d7cff;
}

.product-image{
  width:100%;
  height:210px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.product-info{
  padding:18px;
}

.platform{
  display:inline-block;
  padding:5px 9px;
  border-radius:99px;
  background:#eef0ff;
  color:#4d5bd6;
  font-size:11px;
  font-weight:700;
}

.product-name{
  font-size:18px;
  margin:12px 0 8px;
}

.description{
  color:#9eabc8;
  font-size:13px;
  line-height:1.5;
  min-height:40px;
}

.price{
  font-size:24px;
  font-weight:800;
  margin:15px 0;
}

.buy{
  display:block;
  width:100%;
  text-align:center;
  background:#16a34a;
  color:white;
  padding:13px;
  border-radius:10px;
  text-decoration:none;
  font-weight:800;
}

.empty{
  text-align:center;
  padding:50px 20px;
  border:1px dashed #33405f;
  border-radius:18px;
  color:#9eabc8;
}

.footer{
  text-align:center;
  color:#667085;
  font-size:12px;
  margin:40px 0 20px;
}

@media(max-width:600px){
  .hero h1{
    font-size:32px;
  }

  header{
    padding:18px 5%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    Page<span>Forge</span>
  </div>

  <div class="badge">
    Ofertas selecionadas
  </div>
</header>

<main>

<section class="hero">
  <h1>Encontre sua próxima compra.</h1>

  <p>
    Produtos selecionados em grandes plataformas.
  </p>
</section>

<h2 class="section-title">
  🔥 Ofertas em destaque
</h2>

<section id="products" class="products"></section>

<div class="footer">
  Os produtos são vendidos pelas respectivas plataformas.
  Ao clicar em uma oferta, você será direcionado para o site do vendedor.
</div>

</main>

<script>

/*
==================================================
PRODUTOS
==================================================

Por enquanto deixamos alguns exemplos.

Depois que criarmos o admin.html,
os produtos poderão ser administrados por lá.
*/

const produtos = [

  {
    id:1,

    plataforma:"Mercado Livre",

    nome:"Shampoo Hidratante",

    imagem:"https://via.placeholder.com/600x400?text=Shampoo",

    preco:"R$ 39,90",

    descricao:"Shampoo para cuidados diários com os cabelos.",

    link:"https://www.mercadolivre.com.br/"
  },

  {
    id:2,

    plataforma:"Mercado Livre",

    nome:"Condicionador",

    imagem:"https://via.placeholder.com/600x400?text=Condicionador",

    preco:"R$ 34,90",

    descricao:"Condicionador para deixar os cabelos macios.",

    link:"https://www.mercadolivre.com.br/"
  },

  {
    id:3,

    plataforma:"Mercado Livre",

    nome:"Aparelho de Barbear",

    imagem:"https://via.placeholder.com/600x400?text=Gilete",

    preco:"R$ 29,90",

    descricao:"Aparelho de barbear para uso diário.",

    link:"https://www.mercadolivre.com.br/"
  },

  {
    id:4,

    plataforma:"Mercado Livre",

    nome:"Kit de Cuidados para Cabelo",

    imagem:"https://via.placeholder.com/600x400?text=Kit",

    preco:"R$ 79,90",

    descricao:"Kit completo para cuidados com os cabelos.",

    link:"https://www.mercadolivre.com.br/"
  }

];


/*
==================================================
CARREGAR PRODUTOS
==================================================
*/

function carregarProdutos(){

  const area = document.getElementById("products");

  area.innerHTML = "";

  if(produtos.length === 0){

    area.innerHTML = `
      <div class="empty">
        Nenhuma oferta disponível no momento.
      </div>
    `;

    return;
  }


  produtos.forEach(produto => {

    const card = document.createElement("article");

    card.className = "product-card";

    card.innerHTML = `

      <div class="product-image">

        <img
          src="${esc(produto.imagem)}"
          alt="${esc(produto.nome)}"
          onerror="this.src='https://via.placeholder.com/600x400?text=Produto'"
        >

      </div>


      <div class="product-info">

        <span class="platform">
          ${esc(produto.plataforma)}
        </span>


        <h3 class="product-name">
          ${esc(produto.nome)}
        </h3>


        <p class="description">
          ${esc(produto.descricao)}
        </p>


        <div class="price">
          ${esc(produto.preco)}
        </div>


        <a
          class="buy"
          href="${esc(produto.link)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Ver oferta →
        </a>

      </div>

    `;

    area.appendChild(card);

  });

}


/*
==================================================
SEGURANÇA BÁSICA PARA TEXTO
==================================================
*/

function esc(text){

  return String(text).replace(
    /[&<>"']/g,

    function(char){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[char];

    }
  );

}


/*
==================================================
INICIAR
==================================================
*/

carregarProdutos();

</script>

</body>
</html>
